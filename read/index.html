<!doctype html>
<!--
  translate="no"：ブラウザの「このページを翻訳しますか？」を止める。
  翻訳はページの文字を翻訳サーバーへ送って行われるため、CSPでは防げない
  （ブラウザ自身の機能なので、ページに掛けた通信の決まりの外側で動く）。
  本文がそこへ渡らないよう、翻訳の対象にしない宣言をしておく。
-->
<html lang="ja" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!--
      安全のための宣言（CSP）。
      このアプリは通信を一切しない。だから「外へ送る手段」そのものを
      ブラウザ側で禁止している。とくに connect-src 'none' は、
      fetch・XMLHttpRequest・WebSocket・sendBeacon・EventSource を
      すべて封じる指定で、万一なにかが紛れ込んでも本文を送り出せない。
      画像も端末の中で作ったもの（data: / blob:）しか読み込めないので、
      本文に外部の画像URLが書かれていても取りに行かない。
      （開発サーバーでは vite.config.ts がこの行を緩めて動かしている）
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; manifest-src 'self'; worker-src 'self'; child-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <!--
      interactive-widget=resizes-content：
      キーボードが出たときに画面の枠そのものを縮める。これが無いと（Chromeの既定）、
      枠は画面いっぱいのままで下端がキーボードの裏に隠れ、下に置いたボタンが切れる。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f7f4ee" />
    <meta
      name="description"
      content="手元のMarkdown（.md）ファイルを、書店で買った電子書籍のように縦書き・ページめくりで読めるアプリ。左から右へスワイプでページが進みます。完全無料・登録不要・通信なしで、本は端末の中だけに保存されます。"
    />
    <title>栞 | Markdownを本のように読む</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="栞" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/read/main.tsx"></script>
  </body>
</html>
