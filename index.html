<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!--
      外への持ち出しを、ブラウザの側から禁じておく決まり書き（CSP）。
      同じサイトの中に複数のアプリが同居しているため、ここにも同じ決まりを置く。
      同じサイトに置かれたページは、互いの保存場所を読める。どれか一つでも
      外へ送れる口が開いていれば、そこが抜け道になってしまう。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; child-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#7a4de8" />
    <meta
      name="description"
      content="完全無料・ブラウザだけで小説を執筆し、Amazon KDPで販売できる形式（EPUB/DOCX/PDF）に書き出せるWebアプリ。ブラウザからインストールして使えます。"
    />
    <title>小説執筆スタジオ | 無料でAmazon出版原稿を書く</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
